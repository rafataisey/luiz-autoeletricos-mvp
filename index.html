<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luiz Autoelétricos</title>
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <!-- Tailwind via CDN (cacheado pelo Service Worker). Em produção, gere o CSS com a CLI do Tailwind. -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --nav-h: 4.5rem; }
    body { background:#f1f5f9; color:#0f172a; font-size:1rem; -webkit-tap-highlight-color:transparent; }
    .tap { min-height:48px; min-width:48px; }
    :focus-visible { outline:3px solid #1d4ed8; outline-offset:2px; }
    .skip { position:absolute; left:-999px; top:0; background:#fff; padding:.75rem 1rem; z-index:100; }
    .skip:focus { left:0; }
    .qbtn { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.5rem; border-radius:1rem;
            padding:.75rem; font-weight:700; text-align:center; min-height:6.5rem; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:.5rem; border-radius:.75rem; padding:.5rem 1rem;
           font-weight:700; min-height:48px; min-width:48px; }
    .btn-primary { background:#1e40af; color:#fff; }
    .btn-primary:disabled, .btn-primary[aria-disabled="true"] { background:#475569; color:#fff; cursor:not-allowed; }
    .btn-secondary { background:#fff; color:#0f172a; border:2px solid #0f172a; }
    .field { width:100%; min-height:48px; border:2px solid #334155; border-radius:.75rem; padding:.5rem .75rem; background:#fff; font-size:1.125rem; }
    dialog { max-width:min(32rem, 94vw); width:100%; border-radius:1rem; padding:1rem; border:0; }
    dialog::backdrop { background:rgba(15,23,42,.7); }
    @media (prefers-reduced-motion: reduce) { * { animation:none !important; transition:none !important; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Pular para o conteúdo</a>

  <header id="app-header" class="sticky top-0 z-30 bg-slate-900 text-white shadow"></header>
  <div id="banners" class="sticky z-20 space-y-2 px-3 pt-2 empty:hidden" style="top:var(--header-h,5rem)"></div>

  <main id="main" tabindex="-1" class="px-3 pt-3 outline-none" style="padding-bottom:calc(var(--nav-h) + 1rem)"></main>

  <nav id="bottom-nav" aria-label="Navegação principal" class="fixed bottom-0 inset-x-0 z-30 border-t-2 border-slate-900 bg-white"></nav>

  <div id="live" role="status" aria-live="polite" class="sr-only"></div>
  <dialog id="dlg" aria-modal="true"></dialog>

  <noscript><p class="p-4">Este aplicativo precisa de JavaScript.</p></noscript>
  <script src="/db.js"></script>
  <script src="/app.js"></script>
</body>
</html>
